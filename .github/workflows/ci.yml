name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      # Compiles the code and tests of the other systems, which have no runner here.
      - name: Check other platforms
        run: |
          for target in darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            echo "$target"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done
