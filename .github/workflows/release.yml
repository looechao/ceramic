name: Release

# Pushing a tag such as v0.2.0 builds every desktop platform and puts the
# installers and signed updates in a draft release, to review and publish by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag with a draft release to rebuild
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
      # A tag that disagrees with mygo.json would publish misnamed installers.
      - name: Check the version
        run: test "$RELEASE_TAG" = "v$(jq -r .version mygo.json)"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  release-notes:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Create draft release notes
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes changelogithub@15 --draft
      # Draft releases require write access; build jobs receive only the file.
      - name: Prepare update notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = true
          {
            printf '## %s\n\n' "${RELEASE_TAG#v}"
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body |
              sed 's/&nbsp;//g'
          } > CHANGELOG.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: CHANGELOG.md
          if-no-files-found: error

  build:
    needs: release-notes
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build signed updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "Missing update signing key"; exit 1; }
          go tool mygo build -platform "${{ matrix.platform }}"
          for target in $(echo "${{ matrix.platform }}" | tr ',' ' '); do
            test -s "build/${target/\//-}/update-${target/\//-}.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/*/*.dmg
            build/*/*-setup-*.exe
            build/*/*.deb
            build/*/*.tar.gz
            build/*/update-*.json
            build/*/*.delta

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: artifacts
      - name: Upload assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f -print
          test "$(find artifacts -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find artifacts -type f -name '*-setup-*.exe' | wc -l)" -eq 2
          test "$(find artifacts -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find artifacts -type f -name '*.tar.gz' | wc -l)" -eq 6
          test "$(find artifacts -type f -name 'update-*.json' | wc -l)" -eq 6
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = true
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            $(find artifacts -type f)
