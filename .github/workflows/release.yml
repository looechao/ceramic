name: Release

# Pushing a tag such as v0.2.0 builds every desktop platform and puts the
# installers and signed updates in a draft release, to review and publish by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # A tag that disagrees with mygo.json would publish misnamed installers.
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    needs: check
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare update notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          previous=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
          range="$GITHUB_SHA"
          if [ -n "$previous" ]; then range="$previous..$GITHUB_SHA"; fi
          { printf '## %s\n\n' "$version"; git log --no-merges --format='- %s' "$range"; } > CHANGELOG.md
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build signed updates
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY" || { echo "Missing update signing key"; exit 1; }
          go tool mygo build -platform "${{ matrix.platform }}"
          for target in $(echo "${{ matrix.platform }}" | tr ',' ' '); do
            test -s "build/${target/\//-}/update-${target/\//-}.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            build/*/*.dmg
            build/*/*-setup-*.exe
            build/*/*.deb
            build/*/*.tar.gz
            build/*/update-*.json
            build/*/*.delta

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artifacts -type f -print
          test "$(find artifacts -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find artifacts -type f -name '*-setup-*.exe' | wc -l)" -eq 2
          test "$(find artifacts -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find artifacts -type f -name '*.tar.gz' | wc -l)" -eq 6
          test "$(find artifacts -type f -name 'update-*.json' | wc -l)" -eq 6
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            $(find artifacts -type f)
